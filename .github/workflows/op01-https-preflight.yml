name: OP01 Mini App HTTPS preflight
on: [pull_request]
permissions:
  contents: read
jobs:
  https-preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-op01
          POSTGRES_DB: op01_test
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      OP01_DISPOSABLE_POSTGRES: 'YES'
      OP01_TEST_DATABASE_URL: postgresql://postgres:fixture-only-op01@127.0.0.1:55432/op01_test
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y caddy openssl
      - run: python -m pip install -r requirements-acceptance.txt
      - run: python -m pytest -q -s -p no:cacheprovider verification/op01/test_https.py
