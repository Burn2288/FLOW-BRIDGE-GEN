name: FT030 library integrity
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Library integrity and existing media regression
        run: >-
          docker compose -p ft030-${{ github.run_id }} -f compose.test.yaml run --build --rm tests
          sh -ec 'sh scripts/check-pg16-tools.sh && python -m pytest -q -ra -p no:cacheprovider
          tests/test_ft030_library_integrity.py tests/test_library_projection.py tests/test_jo03_projection.py
          tests/test_ml01_delivery_recovery.py tests/test_delivery_ambiguity.py tests/test_ft024_backup_restore.py'
      - name: Remove disposable services
        if: always()
        run: docker compose -p ft030-${{ github.run_id }} -f compose.test.yaml down --remove-orphans
