name: AU-02 synthetic handoff
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate synthetic package
        run: python scripts/validate_au02_handoff.py
      - name: Run handoff regression
        run: python -m unittest discover -s tests -p test_au02_handoff.py -v

