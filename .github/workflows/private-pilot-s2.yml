name: Private pilot S2
on: [pull_request]
permissions:
  contents: read
jobs:
  s2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python3 scripts/run_s2.py
      - if: always()
        run: find reports/s2_runs -name result.json -exec cat {} \;
