name: FT025 music history
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Music pilots and history on disposable PostgreSQL
        run: >-
          docker compose -p ft025-${{ github.run_id }} -f compose.test.yaml run --build --rm tests
          sh -ec 'sh scripts/check-pg16-tools.sh && python -m pytest -q -ra -p no:cacheprovider
          tests/test_clodex_music.py tests/test_fal.py tests/test_ft011_smoke.py tests/test_telegram_consent.py
          miniapp/tests/test_miniapp.py'
      - name: Remove disposable services
        if: always()
        run: docker compose -p ft025-${{ github.run_id }} -f compose.test.yaml down --remove-orphans
