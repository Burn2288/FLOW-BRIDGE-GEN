name: FT022 referral attribution
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-disposable
          POSTGRES_DB: elevenbot_test
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only-disposable@127.0.0.1:55432/elevenbot_test
      DISPOSABLE_POSTGRES_PROFILE: github-service
      DISPOSABLE_POSTGRES_CONFIRM: 'YES'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: git log -1 --format='%H %T'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-acceptance.txt
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ft022_referrals.py tests/test_telegram_consent.py tests/test_private_pilot.py
          tests/test_topups.py tests/test_ft011_smoke.py miniapp/tests/test_miniapp.py
          tests/test_task_wallet.py tests/test_ft029_reconciliation.py tests/test_upgrade_042.py
