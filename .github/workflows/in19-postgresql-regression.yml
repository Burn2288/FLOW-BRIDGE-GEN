name: IN19 PostgreSQL seeded regression
on:
  pull_request:
    branches: ['work/vankhu21/miniapp-read']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seeded-upgrade:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-in19
          POSTGRES_DB: in19_admin
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      IN19_DISPOSABLE_POSTGRES: 'YES'
      IN19_TEST_DATABASE_URL: postgresql://postgres:fixture-only-in19@127.0.0.1:55432/in19_admin
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Select PostgreSQL 16 backup tools
        run: |
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          PATH=/usr/lib/postgresql/16/bin:$PATH sh scripts/check-pg16-tools.sh
      - run: python -m pip install -r requirements-acceptance.txt
      - run: python -m pytest -q -s -p no:cacheprovider verification/in19/test_seeded_upgrade.py
