name: FT018 provider lifecycle
on: [pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-acceptance.txt
      - run: python -m pytest -q -p no:cacheprovider tests/test_provider_lifecycle.py tests/test_provider_manifest.py tests/test_discovery.py
