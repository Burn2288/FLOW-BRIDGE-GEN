name: Audit register offline checks
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python3 .github/check_audit_register.py
      - run: python3 -m unittest discover -s .github/tests -p 'test_audit_register.py'
      - run: python3 .github/check_docs.py
