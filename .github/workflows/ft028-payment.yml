name: FT028 payment and image integration
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Combined payment and image scenarios on disposable PostgreSQL
        run: >-
          docker compose -p ft028-${{ github.run_id }} -f compose.test.yaml run --build --rm tests
          sh -ec 'sh scripts/check-pg16-tools.sh && python -m pytest -q -ra -p no:cacheprovider
          tests/test_ft028_payment_image.py tests/test_platega_db.py tests/test_platega_restart.py
          tests/test_topups.py tests/test_public_image_topup.py tests/test_wallet_profile.py
          tests/test_task_wallet.py tests/test_ft020_http_image.py tests/test_ft023_combined.py'
      - name: Remove disposable services
        if: always()
        run: docker compose -p ft028-${{ github.run_id }} -f compose.test.yaml down --remove-orphans
