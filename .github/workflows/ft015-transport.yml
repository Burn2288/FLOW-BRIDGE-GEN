name: FT015 transport boundaries
on: [pull_request]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-disposable
          POSTGRES_DB: elevenbot_test
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only-disposable@127.0.0.1:55432/elevenbot_test
      DISPOSABLE_POSTGRES_PROFILE: github-service
      DISPOSABLE_POSTGRES_CONFIRM: 'YES'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-acceptance.txt
      - name: Load immutable AR-01 regression tests
        run: |
          git fetch --no-tags --depth=1 origin 332c638829b9fbd83ee7d0a5a79658eac48e78f8
          git show 332c638829b9fbd83ee7d0a5a79658eac48e78f8:tests/test_ft014_boundaries.py > tests/test_ft014_external.py
      - run: python -m pytest -q -s -p no:cacheprovider tests/test_ft015_transport_boundaries.py tests/test_ft014_external.py tests/test_ft011_smoke.py tests/test_financial.py::test_A02_twenty_confirmations tests/test_financial.py::test_A07_ownership tests/test_worker.py::test_A10_timeout
