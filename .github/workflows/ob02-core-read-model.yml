name: OB02 internal read model
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: PostgreSQL 16 aggregate and financial regression
        run: >-
          docker compose -p ob02-${{ github.run_id }} -f compose.test.yaml run --build --rm tests
          sh -ec 'sh scripts/check-pg16-tools.sh && python -m pytest -q -ra -p no:cacheprovider
          tests/test_ob02_read_model.py tests/test_ft029_reconciliation.py
          tests/test_generation_finance.py tests/test_financial.py tests/test_task_wallet.py tests/test_topups.py'
      - name: Remove disposable services
        if: always()
        run: docker compose -p ob02-${{ github.run_id }} -f compose.test.yaml down --remove-orphans
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install headless Chromium smoke dependencies
        run: python -m pip install -r requirements-acceptance.txt playwright==1.56.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify OB-02 demo in headless Chromium
        run: python -m pytest -q -ra -p no:cacheprovider verification/ob02/test_read_model_demo.py verification/ob02/test_referral_finances_browser.py
      - name: Upload OB-02 demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ob02-report-demo-${{ github.run_id }}
          path: artifacts/ob02-report-demo.png
          if-no-files-found: warn
