name: FT006 integrated functional smoke
on:
  push:
    branches: ['work/burn2288/ft006-integration']
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only-disposable
          POSTGRES_DB: elevenbot_test
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only-disposable@127.0.0.1:55432/elevenbot_test
      DISPOSABLE_POSTGRES_PROFILE: github-service
      DISPOSABLE_POSTGRES_CONFIRM: 'YES'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-acceptance.txt
      - run: python -m pytest -q -s -p no:cacheprovider tests/test_ft006_smoke.py tests/test_consent_contract.py tests/test_jo_functional_smoke.py tests/test_library_projection.py tests/test_openapi_viewer.py tests/test_local_miniapp_preview.py
