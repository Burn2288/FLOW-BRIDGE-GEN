services:
  miniapp:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://elevenbot_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/elevenbot
      AUDIO_STORAGE_DIR: /app/data/audio
    volumes:
      - audio:/app/data/audio:ro
      - catalogue:/app/data/catalogue:ro
    command: [miniapp]
    ports: ["127.0.0.1:8091:8091"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
