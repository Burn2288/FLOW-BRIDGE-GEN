name: elevenbot
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://elevenbot_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/elevenbot
    AUDIO_STORAGE_DIR: /app/data/audio
  volumes:
    - audio:/app/data/audio
    - catalogue:/app/data/catalogue
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    db: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: elevenbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: elevenbot
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U elevenbot -d elevenbot']
      interval: 5s
      retries: 10
    # No published DB port.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://elevenbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/elevenbot
    command: [migrate]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  bot:
    <<: *app
    command: [bot]
    healthcheck:
      test: [CMD, python, -m, elevenbot, health, --component, bot]
      interval: 30s
      timeout: 10s
      retries: 5
  worker:
    <<: *app
    command: [worker]
    healthcheck:
      test: [CMD, python, -m, elevenbot, health, --component, worker]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  pgdata:
  audio:
  catalogue:
