name: flowbridge-dev
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: flowbridge_dev
    ports:
      - "127.0.0.1:${FLOWBRIDGE_DEV_MINIAPP_PORT:-8091}:8091"
      - "127.0.0.1:${FLOWBRIDGE_DEV_TELEGRAM_PORT:-8081}:8081"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d flowbridge_dev']
      interval: 2s
      timeout: 3s
      retries: 20
  bot:
    network_mode: service:db
    build:
      context: .
      dockerfile: Dockerfile.test
    command: [python, -u, scripts/dev_bot.py]
    stop_signal: SIGINT
    environment:
      DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/flowbridge_dev
      AUDIO_STORAGE_DIR: /home/tester/data/audio
      PYTHONPATH: /app/src:/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - runtime:/home/tester
    healthcheck:
      test: [CMD, python, -m, elevenbot, health, --component, bot]
      interval: 3s
      timeout: 5s
      retries: 20
  worker:
    extends:
      service: bot
    command: [python, -u, scripts/dev_bot.py, worker]
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, elevenbot, health, --component, worker]
      interval: 3s
      timeout: 5s
      retries: 20
  miniapp:
    extends:
      service: bot
    command: [python, -u, scripts/dev_bot.py, miniapp]
    depends_on:
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8091/healthz', timeout=3).close()"]
volumes:
  postgres:
  runtime:
