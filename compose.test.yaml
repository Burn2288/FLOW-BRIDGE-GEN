name: elevenbot-acceptance
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: elevenbot_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d elevenbot_test']
      interval: 2s
      retries: 20
  tests:
    network_mode: service:db
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/elevenbot_test
      DISPOSABLE_POSTGRES_PROFILE: compose-service
      DISPOSABLE_POSTGRES_CONFIRM: 'YES'
    depends_on:
      db: {condition: service_healthy}
networks:
  default:
    internal: true
