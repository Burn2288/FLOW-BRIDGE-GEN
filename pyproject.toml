[project]
name = "elevenbot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.5",
    "asyncpg==0.32.0",
    "httpx[socks]==0.28.1",
    "pillow==13.0.0",
    "simplejpeg==1.9.0",
]
[dependency-groups]
dev = [
    "pglast>=8.7",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
elevenbot = ["welcome.png", "darkflow-energy-strip.gif"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
